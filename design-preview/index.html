<title>Open sales orders · NEOUSYS MES</title>
<style>
/* The existing MES green identity, with a shared scale for type, spacing and controls. */
:root {
  --green: #18734d; --green-hover: #125b3c; --green-ink: #155b3e;
  --mint: #edf6f0; --mint-line: #cbded1; --ink: #253346; --muted: #58697a;

}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; scroll-behavior: smooth; }
body { margin: 0; color: var(--ink); background: var(--page); font: 15px/1.5 var(--font); }
button, input, textarea, select { font: inherit; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: var(--green); text-underline-offset: 3px; }
a:hover { color: var(--green-hover); }
button:focus-visible, a:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

::selection { color: var(--green-ink); background: #cce9d8; }
input, textarea { caret-color: var(--green); }
::placeholder { color: #657585; opacity: 1; }
* { scrollbar-width: thin; scrollbar-color: #a5b8ac var(--soft); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.icon { width: 18px; height: 18px; flex: none; vertical-align: middle; stroke-width: 1.7; }
.preview-strip { background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); padding-block: 2px; }
#skip-link:focus { position: fixed; top: 8px; left: 8px; width: auto; height: auto; margin: 0; clip: auto; padding: 12px 18px; background: var(--surface); border: 2px solid var(--green); border-radius: 5px; z-index: 20; }
main#content:focus { outline: none; }
.preview-inner, .nav-inner { max-width: 1504px; margin: auto; padding-inline: 40px; }
.preview-inner { min-height: 34px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.brand-mark .icon { width: 25px; height: 25px; }

.nav-links a:hover { background: #e1efe6; }

.clear-search:hover { background: var(--soft); }
input, select, textarea { background: var(--surface); color: var(--ink); border: 1px solid #c5d1c9; border-radius: 5px; padding: 10px 12px; min-height: 42px; width: 100%; font-size: 13px; }

label.field-label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 7px; }
.table-wrap { overflow-x: auto; }

tbody tr:last-child td { border-bottom: 0; }
.list-table tbody tr:hover { background: #f6faf7; }

.order-id:hover { text-decoration: underline; }
.order-id .icon { width: 14px; margin-left: 3px; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; color: var(--green-ink); background: var(--mint); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 11px; white-space: nowrap; }

function parseSerials(text) {
  // Count non-empty lines as entered. Do not sort, deduplicate, or split on punctuation.
  return String(text||'').split(/\r\n|\n|\r/).map(line=>line.trim()).filter(Boolean);
}

function previewDraft() {
  const d=currentDraft,o=orders.find(o=>o.id===d.order), errors=[];
  clearEditorValidation();
  d.preview=null;document.getElementById('work-order-preview').innerHTML='';
  function fail(text,id) {errors.push(text);document.getElementById(id)?.setAttribute('aria-invalid','true');}
  if(d.manual) {
    if(!d.customer.trim())fail('Enter a customer name.','manual-customer');
    if(!d.order.trim())fail('Enter an NTA order ID.','manual-order');
  }
  const quantities={};
  d.items.forEach((i,n)=>{
    if(!i.name.trim())fail(`Item ${n+1}: enter a product number.`,`name-${n}`);
    const expected=Number(i.quantity),valid=i.quantity!==''&&Number.isInteger(expected)&&expected>=0;
    if(!valid)fail(`Item ${n+1}: enter a whole-number quantity of zero or more.`,`qty-${n}`);
    quantities[i.name.trim().toLowerCase()]=(quantities[i.name.trim().toLowerCase()]||0)+expected;
    if(valid) {
      const count=parseSerials(i.serialText).length,feedback=document.getElementById(`serial-feedback-${n}`);
      const matches=count===expected,difference=Math.abs(expected-count);
      const message=matches?`${count} serial line${count===1?'':'s'} · Quantity: ${expected}. Matched.`:`${count} serial line${count===1?'':'s'} entered. Quantity is ${expected}. ${count<expected?'Add':'Remove'} ${difference} line${difference===1?'':'s'} or change the quantity.`;
      feedback.hidden=false;feedback.className=`serial-feedback ${matches?'match':'error'}`;feedback.textContent=message;
      if(!matches)fail(`${i.name||`Item ${n+1}`}: serial line count does not match quantity.`,`serials-${n}`);
    }
  });
  if(o)d.items.forEach((i,n)=>{if(quantities[i.name.trim().toLowerCase()]>remaining(o,i.name,d.savedKey))fail(`${i.name}: the total quantity exceeds the ${remaining(o,i.name,d.savedKey)} units available.`,`qty-${n}`);});
  if(errors.length) {
    document.getElementById('editor-errors').innerHTML=notice(`<strong>Review these fields before you preview.</strong><ul>${[...new Set(errors)].map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`,'error');
    document.querySelector('[aria-invalid="true"]')?.focus();return;
  }
  document.getElementById('editor-errors').innerHTML='';
  d.items.forEach(i=>i.quantity=Number(i.quantity));
  d.preview=d.items.map(i=>({...clone(i),serials:parseSerials(i.serialText)}));
  renderPreview();document.getElementById('workflow').innerHTML=workflow(1);
  document.getElementById('work-order-preview').scrollIntoView({behavior:'smooth',block:'start'});
}

  const route=location.hash.slice(1).split('/'),w=route[0]==='saved'?history.find(w=>w.key===route[1]):currentDraft,items=w?.preview||w?.items;
  if(!w||!items)return;
  const cell=value=>`<td style="border:1px solid #000;padding:5px">${esc(value).replace(/\n/g,'<br>')}</td>`;
  const rows=kind==='header'?[w.customer,w.po,w.order].map(v=>[v]):items.map(i=>[i.name,i.quantity,i.serials.join('\n'),i.notes,'']);
  const html=`<table style="border-collapse:collapse;font-family:Calibri,sans-serif;font-size:11pt;color:#000">${rows.map(row=>`<tr>${row.map(cell).join('')}</tr>`).join('')}</table>`;
  const text=rows.map(row=>row.join('\t')).join('\n');
  try {
    if(navigator.clipboard?.write && window.ClipboardItem)await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
    else throw new Error('Use selection copy');
    toast(`${kind==='header'?'Customer header':'Picking rows'} copied. Paste in Word with Keep Source Formatting.`);
  } catch {
    const box=document.createElement('div');box.innerHTML=html;box.style.cssText='position:fixed;left:-10000px;top:0';document.body.append(box);
    const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(box);selection.removeAllRanges();selection.addRange(range);
    const ok=document.execCommand('copy');selection.removeAllRanges();box.remove();
    toast(ok?'Copied for Word. Paste with Keep Source Formatting.':'Copy was blocked by the browser. Select the visible table and copy it manually.');
  }
}
function notFound() {content.innerHTML=head('This sample record is unavailable','The demo resets when the page reloads.',btn('Open sales orders','#orders','primary'));}
function route(focus = true) {
  const [view='orders',id]=location.hash.replace(/^#/,'').split('/');
  const nav=view==='history'||view==='saved'?'history':view==='planning'||view==='review'||view==='review-order'?'planning':'orders';
  document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  currentDraft=null;
  if(view==='orders'||view==='')showOrders();else if(view==='history')showHistory();else if(view==='editor')showEditor(id);else if(view==='manual')showEditor('manual');else if(view==='revise'){const w=history.find(w=>w.key===id);w?showEditor(w.order,id):notFound();}else if(view==='saved')showSaved(id);else if(view==='planning')showPlanning();else if(view==='review')showReview();else if(view==='review-order')showReviewOrder(id);else notFound();
  document.title=`${content.querySelector('h1')?.textContent||'Workspace'} · NEOUSYS MES`;
  if(focus){window.scrollTo({top:0,behavior:'instant'});content.focus({preventScroll:true});}
}
content.addEventListener('input',event=>{
  const t=event.target;
  if(t.dataset.search){const scope=t.dataset.search;filters[scope].q=t.value;document.querySelector(`[data-clear="${scope}"]`).hidden=!t.value;({orders:updateOrders,history:updateHistory,review:updateReview})[scope]();}
  if(t.dataset.draftField&&currentDraft){currentDraft[t.dataset.draftField]=t.value;invalidatePreview();}
  if(t.dataset.itemField&&currentDraft){const i=currentDraft.items[Number(t.dataset.index)];i[t.dataset.itemField]=t.value;invalidatePreview();}
  if(t.id==='review-date'&&reviewOrder){reviewOrder.date=t.value;t.removeAttribute('aria-invalid');document.getElementById('date-error').textContent='';}
});
content.addEventListener('change',event=>{
  const t=event.target;
  if(t.id==='review-filter'){filters.review.status=t.value;updateReview();}
  if(t.dataset.schedule){const o=orders.find(o=>o.id===t.dataset.schedule);if(t.value===o.date)delete scheduleDraft[o.id];else scheduleDraft[o.id]=t.value;const scroll=window.scrollY;showPlanning();window.scrollTo({top:scroll,behavior:'instant'});document.getElementById(t.id)?.focus({preventScroll:true});}
});
content.addEventListener('submit',event=>{if(event.target.id==='editor-form'){event.preventDefault();previewDraft();}});
content.addEventListener('click',event=>{
  const t=event.target.closest('button');if(!t)return;
  if(t.dataset.clear){const scope=t.dataset.clear;filters[scope].q='';const input=document.getElementById('search-'+scope);input.value='';t.hidden=true;({orders:updateOrders,history:updateHistory,review:updateReview})[scope]();input.focus();}
  if(t.dataset.moveItem){const n=Number(t.dataset.moveItem),to=n+Number(t.dataset.direction);[currentDraft.items[n],currentDraft.items[to]]=[currentDraft.items[to],currentDraft.items[n]];invalidatePreview();renderItems();document.querySelector(`[data-move-item="${to}"][data-direction="${t.dataset.direction}"]`)?.focus();toast('Item order updated for this release.');}
  if(t.dataset.removeItem){currentDraft.items.splice(Number(t.dataset.removeItem),1);invalidatePreview();renderItems();}
  if(t.dataset.reviewMove){const n=Number(t.dataset.reviewMove),to=n+Number(t.dataset.direction);[reviewOrder.items[n],reviewOrder.items[to]]=[reviewOrder.items[to],reviewOrder.items[n]];const scroll=window.scrollY;showReviewOrder(reviewOrder.id);window.scrollTo({top:scroll,behavior:'instant'});document.querySelector(`[data-review-move="${to}"][data-direction="${t.dataset.direction}"]`)?.focus();}
  if(t.dataset.copy)copyForWord(t.dataset.copy);
  if(t.dataset.week){weekOffset=Math.max(0,weekOffset+Number(t.dataset.week));showPlanning();}
  switch(t.dataset.action){
    case 'all-review':filters.review={q:'',status:'all'};showReview();break;
    case 'add-item':currentDraft.items.push({...item('',1,'Manual'),serialText:''});invalidatePreview();renderItems();document.getElementById(`name-${currentDraft.items.length-1}`).focus();break;
    case 'save-wo':saveWO();break;
    case 'save-schedule':Object.entries(scheduleDraft).forEach(([id,date])=>{orders.find(o=>o.id===id).date=date;});scheduleDraft={};showPlanning();toast('Schedule saved in this demo. The MRP schedule is unchanged.');break;
    case 'discard-schedule':scheduleDraft={};showPlanning();toast('Staged date changes discarded.');break;
    case 'sync':t.disabled=true;t.innerHTML=icon('refresh')+'Loading sample snapshot…';setTimeout(()=>{if(document.contains(t)){t.disabled=false;t.innerHTML=icon('refresh')+'Sync Google Sheet';}toast('Sample snapshot loaded. No Google Sheet connection was used.');},700);break;
    case 'source-order':reviewOrder.items=clone(initialReviews.find(o=>o.id===reviewOrder.id).items);showReviewOrder(reviewOrder.id);toast('Source item order restored for review.');break;
    case 'approve':approveOrder();break;
  }
});
document.getElementById('reset-demo').onclick=()=>{
  if(!confirm('Reset this demo? All work orders, approvals and schedule changes created in this preview will be discarded.'))return;
  orders=clone(initialOrders);history=clone(initialHistory);reviews=clone(initialReviews);drafts={};scheduleDraft={};reviewOrder=null;weekOffset=0;filters={orders:{q:''},history:{q:''},review:{q:'',status:'pending'}};
  if(location.hash==='#orders')route();else location.hash='orders';toast('Sample data restored.');
};
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
document.getElementById('brand-mark').innerHTML=icon('clover');document.getElementById('preview-info-icon').innerHTML=icon('info');
document.getElementById('skip-link').onclick=event=>{event.preventDefault();content.focus();};
window.addEventListener('hashchange',()=>route());
route(false);
</script>
