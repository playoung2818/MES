<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MES | Work Orders{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='clover.svg') }}">
  <link href="{{ url_for('static', filename='vendor/bootstrap-5.3.3.min.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='workspace.css') }}?v=4">
  <link rel="stylesheet" href="{{ url_for('static', filename='word-export.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='planning.css') }}?v=3">
  <link rel="stylesheet" href="{{ url_for('static', filename='workspace-polish.css') }}?v=1">
</head>
<body class="workspace-page">
<a class="workspace-skip" href="#main-content">Skip to content</a>
<nav class="workspace-nav" aria-label="Main navigation">
  <div class="workspace-nav-inner">
    <a class="workspace-brand" href="{{ url_for('main.index') }}" aria-label="NEOUSYS MES home">
      <span class="workspace-brand-mark"><img src="{{ url_for('static', filename='clover.svg') }}" width="24" height="24" alt="" style="filter:brightness(0) invert(1)"></span>
      <span><strong>NEOUSYS</strong><small>MES / WORK ORDERS</small></span>
    </a>
    <div class="workspace-links">
      <a href="{{ url_for('main.index') }}" {% if request.endpoint in ['main.index', 'main.so_detail', 'main.manual_wo'] %}aria-current="page"{% endif %}>Sales orders</a>
      <a href="{{ url_for('main.generated_orders') }}" {% if request.endpoint in ['main.generated_orders', 'main.generated_detail'] %}aria-current="page"{% endif %}>Work orders</a>
      <a class="workspace-planning-link" href="{{ url_for('main.production_planning') }}" {% if request.endpoint in ['main.production_planning', 'main.so_review_list', 'main.so_review_detail'] %}aria-current="page"{% endif %}>Production planning</a>
    </div>
  </div>
</nav>
<main class="workspace-main" id="main-content" tabindex="-1">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='word-copy.js') }}" defer></script>
</body>
</html>
